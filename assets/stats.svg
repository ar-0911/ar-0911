<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" fill="none">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <clipPath id="round"><rect width="1200" height="236" rx="18"/></clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .card { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="236" fill="#0d1117"/>
  <rect width="1200" height="236" fill="url(#grid)"/>
<g class="card" style="animation-delay:0.00s">
    <rect x="36" y="24" width="264" height="188" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="36" y="24" width="264" height="3" rx="1.5" fill="#22d3ee" opacity=".85"/>
    <circle cx="82" cy="70" r="22" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/>
    <circle cx="82" cy="70" r="22" fill="none" stroke="#22d3ee">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0.00s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(70,58)">
      <path d="M12 3 L19 6 V11 C19 15.5 16 18.5 12 21 C8 18.5 5 15.5 5 11 V6 Z M12 10 V14 M10 10 A2 2 0 1 1 14 10" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.3;.85;1" dur="5s" begin="0.30s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="60" y="114" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Zero-trust by default</text>
    <text x="60" y="136" class="sans" font-size="13.5" fill="#8b98a9">Remote sites and internal tools</text><text x="60" y="155" class="sans" font-size="13.5" fill="#8b98a9">reachable only through a private,</text><text x="60" y="174" class="sans" font-size="13.5" fill="#8b98a9">identity-checked network.</text>
  </g>
<g class="card" style="animation-delay:0.18s">
    <rect x="324" y="24" width="264" height="188" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="324" y="24" width="264" height="3" rx="1.5" fill="#a78bfa" opacity=".85"/>
    <circle cx="370" cy="70" r="22" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".35"/>
    <circle cx="370" cy="70" r="22" fill="none" stroke="#a78bfa">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" begin="0.18s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(358,58)">
      <path d="M3 6 C8 6 8 12 12 12 M3 18 C8 18 8 12 12 12 M3 12 H12 M12 12 H21 M18 9 L21 12 L18 15" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.3;.85;1" dur="5s" begin="0.48s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="348" y="114" class="sans" font-size="17" font-weight="700" fill="#e6edf3">One governed AI gateway</text>
    <text x="348" y="136" class="sans" font-size="13.5" fill="#8b98a9">Every engineer reaches Claude</text><text x="348" y="155" class="sans" font-size="13.5" fill="#8b98a9">through a single gateway with</text><text x="348" y="174" class="sans" font-size="13.5" fill="#8b98a9">spend controls built in.</text>
  </g>
<g class="card" style="animation-delay:0.36s">
    <rect x="612" y="24" width="264" height="188" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="612" y="24" width="264" height="3" rx="1.5" fill="#fbbf24" opacity=".85"/>
    <circle cx="658" cy="70" r="22" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".35"/>
    <circle cx="658" cy="70" r="22" fill="none" stroke="#fbbf24">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" begin="0.36s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(646,58)">
      <path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.3;.85;1" dur="5s" begin="0.66s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="636" y="114" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Agentic engineering</text>
    <text x="636" y="136" class="sans" font-size="13.5" fill="#8b98a9">Skills and subagents the team</text><text x="636" y="155" class="sans" font-size="13.5" fill="#8b98a9">ships with every day, improved</text><text x="636" y="174" class="sans" font-size="13.5" fill="#8b98a9">from real failure cases.</text>
  </g>
<g class="card" style="animation-delay:0.54s">
    <rect x="900" y="24" width="264" height="188" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="900" y="24" width="264" height="3" rx="1.5" fill="#34d399" opacity=".85"/>
    <circle cx="946" cy="70" r="22" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".35"/>
    <circle cx="946" cy="70" r="22" fill="none" stroke="#34d399">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0.54s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" begin="0.54s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(934,58)">
      <path d="M12 3 A9 9 0 1 1 11.99 3 M8 12.5 L11 15.5 L16.5 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.3;.85;1" dur="5s" begin="0.84s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="924" y="114" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Audit-ready cloud</text>
    <text x="924" y="136" class="sans" font-size="13.5" fill="#8b98a9">Hardened containers and automated</text><text x="924" y="155" class="sans" font-size="13.5" fill="#8b98a9">fixes that cleared an external</text><text x="924" y="174" class="sans" font-size="13.5" fill="#8b98a9">cloud security audit.</text>
  </g>

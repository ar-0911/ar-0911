<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" fill="none">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <clipPath id="round"><rect width="1200" height="190" rx="18"/></clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .card { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="190" fill="#0d1117"/>
  <rect width="1200" height="190" fill="url(#grid)"/>
<g class="card" style="animation-delay:0.00s">
    <rect x="36" y="28" width="264" height="134" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="36" y="28" width="264" height="3" rx="1.5" fill="#22d3ee" opacity=".85"/>
    <text x="60" y="86" class="sans" font-size="40" font-weight="800" fill="#22d3ee">30+</text>
    <text x="60" y="112" class="sans" font-size="14" fill="#e6edf3">edge nodes on a</text>
    <text x="60" y="131" class="sans" font-size="14" fill="#8b98a9">WireGuard / VyOS mesh</text>
    <rect x="60" y="144" width="216" height="5" rx="2.5" fill="#1f2a3d"/>
    <rect x="60" y="144" width="0" height="5" rx="2.5" fill="#22d3ee">
      <animate attributeName="width" from="0" to="168.5" dur="1.4s" begin="0.40s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    </rect>
    <circle cx="272" cy="58" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
  </g>
<g class="card" style="animation-delay:0.18s">
    <rect x="324" y="28" width="264" height="134" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="324" y="28" width="264" height="3" rx="1.5" fill="#a78bfa" opacity=".85"/>
    <text x="348" y="86" class="sans" font-size="40" font-weight="800" fill="#a78bfa">120</text>
    <text x="348" y="112" class="sans" font-size="14" fill="#e6edf3">internal apps behind</text>
    <text x="348" y="131" class="sans" font-size="14" fill="#8b98a9">Teleport + Cloudflare WARP</text>
    <rect x="348" y="144" width="216" height="5" rx="2.5" fill="#1f2a3d"/>
    <rect x="348" y="144" width="0" height="5" rx="2.5" fill="#a78bfa">
      <animate attributeName="width" from="0" to="194.4" dur="1.4s" begin="0.58s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    </rect>
    <circle cx="560" cy="58" r="4" fill="#a78bfa">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.18s" repeatCount="indefinite"/>
    </circle>
  </g>
<g class="card" style="animation-delay:0.36s">
    <rect x="612" y="28" width="264" height="134" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="612" y="28" width="264" height="3" rx="1.5" fill="#34d399" opacity=".85"/>
    <text x="636" y="86" class="sans" font-size="40" font-weight="800" fill="#34d399">96%</text>
    <text x="636" y="112" class="sans" font-size="14" fill="#e6edf3">fewer critical/high</text>
    <text x="636" y="131" class="sans" font-size="14" fill="#8b98a9">Trivy findings (83 → 3)</text>
    <rect x="636" y="144" width="216" height="5" rx="2.5" fill="#1f2a3d"/>
    <rect x="636" y="144" width="0" height="5" rx="2.5" fill="#34d399">
      <animate attributeName="width" from="0" to="207.4" dur="1.4s" begin="0.76s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    </rect>
    <circle cx="848" cy="58" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.36s" repeatCount="indefinite"/>
    </circle>
  </g>
<g class="card" style="animation-delay:0.54s">
    <rect x="900" y="28" width="264" height="134" rx="14" fill="#111826" stroke="#1f2a3d"/>
    <rect x="900" y="28" width="264" height="3" rx="1.5" fill="#fbbf24" opacity=".85"/>
    <text x="924" y="86" class="sans" font-size="40" font-weight="800" fill="#fbbf24">100%</text>
    <text x="924" y="112" class="sans" font-size="14" fill="#e6edf3">of PRs agent-driven</text>
    <text x="924" y="131" class="sans" font-size="14" fill="#8b98a9">via Claude Code skills</text>
    <rect x="924" y="144" width="216" height="5" rx="2.5" fill="#1f2a3d"/>
    <rect x="924" y="144" width="0" height="5" rx="2.5" fill="#fbbf24">
      <animate attributeName="width" from="0" to="216.0" dur="1.4s" begin="0.94s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    </rect>
    <circle cx="1136" cy="58" r="4" fill="#fbbf24">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.54s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="189" rx="18" stroke="#1f2a3d"/>
</svg>

            <path d="M0.0,60.0 L26.0,37.3 L52.0,34.6 L78.0,50.7 L104.0,67.2 L130.0,70.6 L156.0,64.6 L182.0,60.0 L208.0,59.8 L234.0,59.7 L260.0,59.1 L286.0,62.8 L312.0,70.8" stroke="#22d3ee" stroke-width="2" fill="none"/>
            <path d="M0.0,60.0 L26.0,37.3 L52.0,34.6 L78.0,50.7 L104.0,67.2 L130.0,70.6 L156.0,64.6 L182.0,60.0 L208.0,59.8 L234.0,59.7 L260.0,59.1 L286.0,62.8 L312.0,70.8" stroke="#22d3ee" stroke-width="2" fill="none" transform="translate(312,0)"/>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-312 0" dur="8s" repeatCount="indefinite"/>

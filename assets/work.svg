      <circle cx="30" cy="64" r="12" fill="#111826" stroke="#8b98a9"/><text x="30" y="96" text-anchor="middle" class="mono" font-size="10" fill="#8b98a9">user</text>
      <rect x="96" y="44" width="40" height="40" rx="8" fill="#111826" stroke="#fbbf24"/><text x="116" y="69" text-anchor="middle" class="mono" font-size="10" fill="#fbbf24">WARP</text>
      <rect x="176" y="44" width="40" height="40" rx="8" fill="#111826" stroke="#a78bfa"/><text x="196" y="69" text-anchor="middle" class="mono" font-size="10" fill="#a78bfa">TP</text>
      <rect x="258" y="48" width="36" height="32" rx="6" fill="#111826" stroke="#34d399"/><text x="276" y="68" text-anchor="middle" class="mono" font-size="10" fill="#34d399">app</text>
      <text x="116" y="104" text-anchor="middle" class="mono" font-size="9.5" fill="#8b98a9">device</text>
      <text x="196" y="104" text-anchor="middle" class="mono" font-size="9.5" fill="#8b98a9">identity</text>
      <circle r="5" fill="#22d3ee"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;.3;.33;.6;.63;1" keyTimes="0;.25;.4;.6;.75;1" calcMode="linear"><mpath href="#ztp"/></animateMotion></circle>
      <circle cx="116" cy="30" r="5" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.3;.38;.5;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="196" cy="30" r="5" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.6;.68;.8;1" dur="3s" repeatCount="indefinite"/></circle>

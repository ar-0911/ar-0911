      <text x="48" y="64" class="sans" font-size="22" font-weight="800" fill="#e6edf3">83<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.9;1" dur="6s" repeatCount="indefinite"/></text>
      <text x="48" y="64" class="sans" font-size="22" font-weight="800" fill="#34d399" opacity="0">3<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.9;1" dur="6s" repeatCount="indefinite"/></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <clipPath id="round"><rect width="1200" height="430" rx="18"/></clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .card { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="430" fill="#0d1117"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
<g class="card" style="animation-delay:0.00s">
    <rect x="36" y="36" width="360" height="358" rx="16" fill="#111826" stroke="#1f2a3d"/>
    
    <text x="60" y="76" class="mono" font-size="12" fill="#22d3ee" letter-spacing="1.5">01 · ZERO-TRUST ACCESS</text>
    <text x="60" y="104" class="sans" font-size="20" font-weight="700" fill="#e6edf3">Edge mesh + identity access</text>
    <g transform="translate(60,132)">

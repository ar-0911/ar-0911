<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" fill="none">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1" opacity=".55"/>
  </pattern>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter></defs>
<style>.sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; } .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }</style>
<rect width="1200" height="64" rx="12" fill="#0d1117"/>

  <rect x="0" y="0" width="1200" height="64" fill="#0d1117"/>
  <text x="36" y="40" class="mono" font-size="15" fill="#34d399">~/</text>
  <text x="60" y="40" class="sans" font-size="22" font-weight="700" fill="#e6edf3">stack</text>
  <text x="141" y="40" class="mono" font-size="13" fill="#8b98a9"># tools I use daily</text>
  <rect x="36" y="54" width="0" height="2" rx="1" fill="url(#brand)">
    <animate attributeName="width" from="0" to="1128" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
  </rect>
  <circle cx="36" cy="55" r="3.5" fill="#34d399">
    <animate attributeName="cx" values="36;1164" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
